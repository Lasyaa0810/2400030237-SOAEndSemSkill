server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service-root
              uri: http://localhost:8081
              predicates:
                - Path=/api/account
              filters:
                - StripPrefix=1
                - SetPath=/accounts

            - id: account-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/account/**
              filters:
                - StripPrefix=1
                - RewritePath=/account/(?<segment>.*), /accounts/$\{segment}